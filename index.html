
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeatherNow | Live Weather</title>
  <link rel="stylesheet" href="./style.css?v=4">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <header>
      <h1>🌤️ Weather<span>Now</span></h1>
      <p>Discover the weather, plan your day 💙</p>
    </header>

    <form id="search-form">
      <input id="city-input" type="search"
        placeholder="🔍 Enter city name..." required>
      <button id="search-button" type="submit">🔍 Search</button>
    </form>

    <p id="status" role="status">Loading weather...</p>

    <section id="weather" class="hidden">
      <div class="current card">
        <div class="place">
          <div>
            <h2 id="city-name">Hyderabad</h2>
            <p id="country">India</p>
          </div>
          <p id="date"></p>
        </div>

        <div class="hero">
          <span id="icon">🌤️</span>
          <div>
            <h2 id="temperature">--°C</h2>
            <p id="description">Loading...</p>
            <p>Feels like <span id="feels">--</span>°C</p>
          </div>
        </div>

        <div class="details">
          <div class="detail card">
            <span>💧</span>
            <p>Humidity</p>
            <h3 id="humidity">--%</h3>
          </div>
          <div class="detail card">
            <span>🌬️</span>
            <p>Wind Speed</p>
            <h3 id="wind">-- km/h</h3>
          </div>
          <div class="detail card">
            <span>🌡️</span>
            <p>Feels Like</p>
            <h3 id="feels2">--°C</h3>
          </div>
        </div>

        <h2 class="forecast-title">5-Day Forecast 🌦️</h2>
        <div id="forecast" class="forecast"></div>
      </div>
    </section>

    <footer>♡ Powered by
      <a href="https://open-meteo.com/">Open-Meteo</a>
    </footer>
  </main>
</body>
</html>
